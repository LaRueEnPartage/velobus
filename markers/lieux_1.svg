<svg xmlns="http://www.w3.org/2000/svg" width="120" height="100" viewBox="0 0 120 100" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>École avec maîtresse et élèves</title>
  <!-- Murs -->
  <rect x="14" y="38" width="92" height="52" fill="#FBEFD5" stroke="#8A6D3B" stroke-width="2"/>
  <!-- Toit -->
  <path d="M6 40 L60 8 L114 40 Z" fill="#C0392B" stroke="#8E2A20" stroke-width="2" stroke-linejoin="round"/>
  <!-- Sol -->
  <rect x="14" y="86" width="92" height="4" fill="#B08A57"/>

  <!-- Tableau -->
  <rect x="19" y="50" width="26" height="18" fill="#2E6B4F" stroke="#6D4C2F" stroke-width="2"/>
  <path d="M23 57 H38 M23 62 H33" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Maîtresse -->
  <g>
    <line x1="49" y1="66" x2="42" y2="58" stroke="#6D4C2F" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M49 60 Q54 56 59 60 L62 82 H46 Z" fill="#8E44AD"/>
    <line x1="51" y1="82" x2="51" y2="86" stroke="#F1C9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="57" y1="82" x2="57" y2="86" stroke="#F1C9A5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="54" cy="52" r="5.5" fill="#5A3825"/>
    <circle cx="54" cy="53" r="4.5" fill="#F1C9A5"/>
  </g>

  <!-- Élèves assis à leur table -->
  <g>
    <!-- élève 1 -->
    <rect x="68" y="66" width="8" height="10" rx="2" fill="#2E86C1"/>
    <circle cx="72" cy="61" r="4.5" fill="#F1C9A5"/>
    <rect x="65" y="74" width="14" height="3" fill="#A9743F"/>
    <path d="M67 77 V86 M77 77 V86" stroke="#6D4C2F" stroke-width="1.5"/>
    <!-- élève 2 -->
    <rect x="81" y="66" width="8" height="10" rx="2" fill="#27AE60"/>
    <circle cx="85" cy="61" r="4.5" fill="#E8B88F"/>
    <rect x="78" y="74" width="14" height="3" fill="#A9743F"/>
    <path d="M80 77 V86 M90 77 V86" stroke="#6D4C2F" stroke-width="1.5"/>
    <!-- élève 3 -->
    <rect x="94" y="66" width="8" height="10" rx="2" fill="#E67E22"/>
    <circle cx="98" cy="61" r="4.5" fill="#F1C9A5"/>
    <rect x="91" y="74" width="14" height="3" fill="#A9743F"/>
    <path d="M93 77 V86 M103 77 V86" stroke="#6D4C2F" stroke-width="1.5"/>
  </g>
</svg>

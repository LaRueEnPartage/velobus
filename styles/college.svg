    <path d="M-5 -26 Q0 -30 5 -26 L8 -4 H-8 Z" fill="#8E44AD"/>
    <line x1="-3" y1="-4" x2="-3" y2="0" stroke="#F1C9A5" stroke-width="2" stroke-linecap="round"/>
    <line x1="3" y1="-4" x2="3" y2="0" stroke="#F1C9A5" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="-34" r="5.5" fill="#5A3825"/>
    <circle cx="0" cy="-33" r="4.5" fill="#F1C9A5"/>
  </g>
  <!-- Élève 1 -->
  <g transform="translate(80 72) scale(0.9)">
    <rect x="-4" y="-20" width="8" height="10" rx="2" fill="#2E86C1"/>
    <circle cx="0" cy="-25" r="4.5" fill="#F1C9A5"/>
    <rect x="-7" y="-12" width="14" height="3" fill="#A9743F"/>

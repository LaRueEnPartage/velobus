<svg xmlns="http://www.w3.org/2000/svg" width="140" height="120" viewBox="0 0 140 120" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Collège</title>
  <!-- Murs -->
  <rect x="16" y="34" width="108" height="80" fill="#E8EEF7" stroke="#3B4F6B" stroke-width="2"/>
  <!-- Toit -->
  <path d="M8 36 L70 6 L132 36 Z" fill="#2C5F9E" stroke="#1D3F6B" stroke-width="2" stroke-linejoin="round"/>
  <!-- Horloge -->
  <circle cx="70" cy="22" r="5.5" fill="#FFFFFF" stroke="#1D3F6B" stroke-width="1.2"/>
  <path d="M70 18.5 V22 H72.8" fill="none" stroke="#1D3F6B" stroke-width="1.1" stroke-linecap="round"/>
  <!-- Plancher de l'étage -->
  <rect x="16" y="72" width="108" height="4" fill="#B08A57"/>

  <!-- ÉTAGE : salle de classe -->
  <!-- Tableau -->
  <rect x="22" y="42" width="26" height="20" fill="#2E6B4F" stroke="#6D4C2F" stroke-width="2"/>
  <path d="M26 49 H42 M26 55 H35" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Professeur -->
  <g transform="translate(58 72) scale(0.9)">

  <path d="M64 114 V94 a6 6 0 0 1 12 0 V114 Z" fill="#6D4C2F" stroke="#4A331F" stroke-width="1.2"/>
  <circle cx="73" cy="104" r="0.9" fill="#F5D6A0"/>


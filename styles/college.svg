    <rect x="22" y="86" width="16" height="16" rx="1"/>
    <rect x="44" y="86" width="16" height="16" rx="1"/>
    <rect x="80" y="86" width="16" height="16" rx="1"/>
    <rect x="102" y="86" width="16" height="16" rx="1"/>

  </g>
  <!-- Élève 2 -->
  <g transform="translate(94 72) scale(0.9)">
    <rect x="-4" y="-20" width="8" height="10" rx="2" fill="#27AE60"/>
    <circle cx="0" cy="-25" r="4.5" fill="#E8B88F"/>
    <rect x="-7" y="-12" width="14" height="3" fill="#A9743F"/>
    <path d="M-5 -9 V0 M5 -9 V0" stroke="#6D4C2F" stroke-width="1.5"/>
  </g>
  <!-- Élève 3 -->
  <g transform="translate(108 72) scale(0.9)">
    <rect x="-4" y="-20" width="8" height="10" rx="2" fill="#E67E22"/>
    <circle cx="0" cy="-25" r="4.5" fill="#F1C9A5"/>
    <rect x="-7" y="-12" width="14" height="3" fill="#A9743F"/>
    <path d="M-5 -9 V0 M5 -9 V0" stroke="#6D4C2F" stroke-width="1.5"/>
